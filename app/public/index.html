<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Demo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary-glow: rgba(56, 189, 248, 0.5);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            position: relative;
        }

        .dashboard {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px var(--primary-glow);
            animation: pulse 2s infinite alternate;
        }

        .logo svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 20px var(--primary-glow); }
            to { box-shadow: 0 0 40px var(--primary-glow), 0 0 10px #8b5cf6; }
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 1rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .status-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .version-v1 { color: #38bdf8; }
        .version-v2 { color: #10b981; }
        .version-v3 { color: #ef4444; }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        .status-healthy {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-healthy { background-color: var(--success-color); box-shadow: 0 0 10px var(--success-color); }
        .dot-error { background-color: var(--error-color); box-shadow: 0 0 10px var(--error-color); }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .bg-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="container">
        <div class="dashboard">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <h1>Kubernetes App</h1>
            <p class="subtitle" id="message">Connecting to cluster...</p>

            <div class="status-grid" id="data-container" style="display: none;">
                <div class="status-card">
                    <div class="card-label">Current Version</div>
                    <div class="card-value" id="version-display">--</div>
                </div>
                <div class="status-card">
                    <div class="card-label">System Status</div>
                    <div id="health-indicator" class="status-indicator">
                        <div class="dot"></div>
                        <span id="health-text">Checking...</span>
                    </div>
                </div>
            </div>
            
            <div id="loading" class="loader"></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            fetch('/api/info')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Server returned ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('data-container').style.display = 'grid';
                    
                    document.getElementById('message').textContent = data.message;
                    
                    const versionDisplay = document.getElementById('version-display');
                    versionDisplay.textContent = data.version;
                    
                    versionDisplay.className = 'card-value version-' + data.version;
                    
                    const healthIndicator = document.getElementById('health-indicator');
                    const healthText = document.getElementById('health-text');
                    const dot = healthIndicator.querySelector('.dot');
                    
                    healthIndicator.className = 'status-indicator status-healthy';
                    healthText.textContent = 'Operational';
                    dot.className = 'dot dot-healthy';
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('data-container').style.display = 'grid';
                    
                    document.getElementById('message').textContent = 'Application Error Encountered';
                    document.getElementById('version-display').textContent = 'v3';
                    document.getElementById('version-display').className = 'card-value version-v3';
                    
                    const healthIndicator = document.getElementById('health-indicator');
                    const healthText = document.getElementById('health-text');
                    const dot = healthIndicator.querySelector('.dot');
                    
                    healthIndicator.className = 'status-indicator status-error';
                    healthText.textContent = 'CrashLoopBackOff';
                    dot.className = 'dot dot-error';
                });
        }, 800);
    </script>
</body>
</html>
